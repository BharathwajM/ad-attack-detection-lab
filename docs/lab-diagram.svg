    <text x="56" y="260" font-size="15" font-weight="700" fill="#1f2328">WS01</text>
    <text x="56" y="281" font-size="12.5" fill="#1f2328">Windows 11 Enterprise</text>
    <text x="56" y="300" font-size="12.5" fill="#57606a">Workstation, 10.10.10.20</text>
    <text x="56" y="319" font-size="12.5" fill="#57606a">Sysmon, Universal Forwarder</text>
    <text x="56" y="338" font-size="12.5" fill="#57606a">Attacker foothold, sched. task</text>
