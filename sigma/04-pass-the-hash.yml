title: Possible Pass-the-Hash - NTLM Network Logon by a User Account
id: 15231476-6123-45ed-bbe4-82b940e31979
status: experimental
description: |
    A type 3 (network) logon by a user account using NTLM through NtLmSsp. The lab's hash-only
    login matched this pattern, but so do normal password logons over NTLM, so treat it as a hunt
    and compare source, destination and account before escalating.
    Sigma version of detections/04-pass-the-hash.spl.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/BharathwajM/ad-attack-detection-lab/blob/main/playbooks/04-pass-the-hash.md
author: Bharathwaj Murali
date: 2026-11-10
tags:
    - attack.lateral-movement
    - attack.t1550.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
        LogonProcessName|startswith: 'NtLmSsp'
    filter_non_user:
        - TargetUserName|endswith: '$'
        - TargetUserName:
              - 'ANONYMOUS LOGON'
              - '-'
    condition: selection and not filter_non_user
falsepositives:
    - Password logons over NTLM from older clients, non-domain hosts or connections made by IP address
level: low
