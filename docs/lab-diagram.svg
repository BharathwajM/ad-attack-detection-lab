    <text x="56" y="96" font-size="15" font-weight="700" fill="#1f2328">DC01</text>
    <text x="56" y="117" font-size="12.5" fill="#1f2328">Windows Server 2025</text>
    <text x="56" y="136" font-size="12.5" fill="#57606a">Domain controller, 10.10.10.10</text>
    <text x="56" y="155" font-size="12.5" fill="#57606a">Sysmon, Universal Forwarder</text>
    <text x="56" y="174" font-size="12.5" fill="#57606a">Kerberos, NTLM, DS audit</text>
  </g>
  <g>
