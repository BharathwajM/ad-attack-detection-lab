    <text x="604" y="176" font-size="15" font-weight="700" fill="#1f2328">SPLUNK01</text>
    <text x="604" y="197" font-size="12.5" fill="#1f2328">Ubuntu 24.04</text>
    <text x="604" y="216" font-size="12.5" fill="#57606a">Splunk Enterprise, 10.10.10.30</text>
    <text x="604" y="235" font-size="12.5" fill="#57606a">index=winlogs</text>
