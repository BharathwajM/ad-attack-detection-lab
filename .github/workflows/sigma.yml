name: Sigma rules

on:
  push:
    paths: ['sigma/**', '.github/workflows/sigma.yml']
  pull_request:
    paths: ['sigma/**', '.github/workflows/sigma.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install sigma-cli and the Splunk backend
        run: pip install sigma-cli pysigma-backend-splunk
      - name: Check rules against the Sigma specification
        run: sigma check sigma/
      - name: Convert every rule to Splunk SPL
        run: sigma convert --target splunk --pipeline splunk_windows sigma/
