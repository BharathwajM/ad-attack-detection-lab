title: Failed Logon (Base Rule for Password Spraying)
id: 57e30277-44df-4da2-b6eb-481624247057
name: failed_logon
status: experimental
description: Any failed logon. Used by the correlation rule below and not meant to alert by itself.
author: Bharathwaj Murali
date: 2026-11-10
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection
level: informational
---
title: Password Spraying - One Source Failing Against Many Accounts
id: c170bc68-99e5-4488-88cf-a5747ef8faa3
status: experimental
description: |
    One source fails to log on as 5 or more different accounts within 10 minutes. Spraying tries a
    few passwords against many accounts, the reverse of brute force. The threshold is tuned to the
    lab; raise it for a busy environment. Sigma version of detections/02-password-spraying.spl.
references:
    - https://attack.mitre.org/techniques/T1110/003/
    - https://github.com/BharathwajM/ad-attack-detection-lab/blob/main/playbooks/02-password-spraying.md
author: Bharathwaj Murali
date: 2026-11-10
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - failed_logon
    group-by:
        - IpAddress
        - WorkstationName
    timespan: 10m
    condition:
        gte: 5
        field: TargetUserName
falsepositives:
    - A shared host or VPN gateway where many users mistype passwords
level: medium
